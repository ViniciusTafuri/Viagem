<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Viagem (Dias 17 a 30)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="app" class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900">Gerenciamento da Próxima Viagem</h1>
            <p class="text-slate-600">Acompanhamento integrado com o Google Sheets (Dias 17 ao 30)</p>
            <div v-if="loading" class="mt-4 text-blue-600 font-medium">Carregando dados da planilha...</div>
            <div v-if="saving" class="mt-2 text-sm text-amber-600 font-medium">Salvando alteração na planilha...</div>
        </header>

        <!-- Filtros por Tipo de Dia -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap gap-2 items-center justify-between">
            <div class="flex flex-wrap gap-2">
                <button @click="filtroTipo = 'Todos'" :class="filtroTipo === 'Todos' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-700'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">Todos</button>
                <button @click="filtroTipo = 'Chegada'" :class="filtroTipo === 'Chegada' ? 'bg-purple-600 text-white' : 'bg-purple-50 text-purple-700'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">🛬 Chegada</button>
                <button @click="filtroTipo = 'Explorar Hub'" :class="filtroTipo === 'Explorar Hub' ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-700'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">🏙️ Explorar Hub</button>
                <button @click="filtroTipo = 'Bate-Volta'" :class="filtroTipo === 'Bate-Volta' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">🚌 Bate-Volta</button>
                <button @click="filtroTipo = 'Mudança de Hub'" :class="filtroTipo === 'Mudança de Hub' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-700'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">🧳 Mudança</button>
                <button @click="filtroTipo = 'Retorno'" :class="filtroTipo === 'Retorno' ? 'bg-pink-600 text-white' : 'bg-pink-50 text-pink-700'" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">🛫 Retorno</button>
            </div>
            <button @click="carregarDados" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-700 transition">Atualizar Dados</button>
        </div>

        <!-- Grid de Cards por Dia -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div v-for="item in diasFiltrados" :key="item.Dia" 
                 class="bg-white rounded-xl shadow-md border p-5 flex flex-col justify-between transition-all"
                 :class="getCardColorClass(item['Tipo de Dia'])">
                <div>
                    <!-- Cabeçalho do Card -->
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-lg text-slate-900">{{ item.Dia }}</span>
                        <select v-model="item['Tipo de Dia']" @change="atualizarPlanilha(item, 'Tipo de Dia', item['Tipo de Dia'])" 
                                class="text-xs font-bold px-2.5 py-1 rounded-full border-0 cursor-pointer shadow-sm outline-none"
                                :class="getBadgeColorClass(item['Tipo de Dia'])">
                            <option value="Chegada">🛬 Chegada</option>
                            <option value="Explorar Hub">🏙️ Explorar Hub</option>
                            <option value="Bate-Volta">🚌 Bate-Volta</option>
                            <option value="Mudança de Hub">🧳 Mudança de Hub</option>
                            <option value="Retorno">🛫 Retorno</option>
                        </select>
                    </div>

                    <!-- Cidade Hub Atual vs Pernoite -->
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">Cidade Hub</label>
                            <input type="text" v-model="item['Cidade Hub Atual']" @blur="atualizarPlanilha(item, 'Cidade Hub Atual', item['Cidade Hub Atual'])" class="w-full text-xs font-semibold border-b border-slate-200 focus:border-blue-500 outline-none py-1 bg-transparent">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">🌙 Pernoite</label>
                            <div class="w-full text-xs font-bold py-1 text-slate-700 border-b border-dashed border-slate-300">
                                {{ getPernoiteValue(item) }}
                            </div>
                        </div>
                    </div>

                    <!-- Destino (Exibido para Bate-Volta, Mudança, Chegada ou Retorno) -->
                    <div class="mb-4" v-if="item['Tipo de Dia'] !== 'Explorar Hub'">
                        <label class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">Destino (Bate-volta / Mudança / Trecho)</label>
                        <input type="text" v-model="item['Destino (Bate-volta / Mudança)']" @blur="atualizarPlanilha(item, 'Destino (Bate-volta / Mudança)', item['Destino (Bate-volta / Mudança)'])" class="w-full text-xs border-b border-slate-200 focus:border-blue-500 outline-none py-1 bg-transparent">
                    </div>

                    <!-- Seção Passagem (Dropdown Sim, Não, N/A) -->
                    <div class="bg-white/80 p-3 rounded-lg mb-3 border border-slate-200/60 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-700">🎫 PASSAGEM</span>
                            <select v-model="item['Passagem Comprada?']" @change="atualizarPlanilha(item, 'Passagem Comprada?', item['Passagem Comprada?'])" 
                                    class="text-xs font-bold border rounded px-2 py-0.5 outline-none cursor-pointer" 
                                    :class="getStatusColorClass(item['Passagem Comprada?'])">
                                <option value="Sim">Sim</option>
                                <option value="Não">Não</option>
                                <option value="N/A">N/A</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold block">Nº COMPROVANTE / BILHETE</label>
                                <input type="text" v-model="item['Nº Comprovante / Bilhete Passagem']" @blur="atualizarPlanilha(item, 'Nº Comprovante / Bilhete Passagem', item['Nº Comprovante / Bilhete Passagem'])" placeholder="Código/Bilhete" class="w-full text-xs bg-white border border-slate-200 rounded px-2 py-1 outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <div class="flex justify-between items-center">
                                    <label class="text-[10px] text-slate-400 font-semibold block">LINK COMPROVANTE PASSAGEM</label>
                                    <a v-if="item['Foto/Link Comprovante Passagem']" :href="item['Foto/Link Comprovante Passagem']" target="_blank" class="text-[10px] text-blue-600 underline font-medium">Abrir</a>
                                </div>
                                <input type="text" v-model="item['Foto/Link Comprovante Passagem']" @blur="atualizarPlanilha(item, 'Foto/Link Comprovante Passagem', item['Foto/Link Comprovante Passagem'])" placeholder="URL do comprovante" class="w-full text-xs bg-white border border-slate-200 rounded px-2 py-1 outline-none focus:border-blue-500">
                            </div>
                        </div>
                    </div>

                    <!-- Seção Airbnb (Dropdown Sim, Não, N/A) -->
                    <div class="bg-white/80 p-3 rounded-lg mb-3 border border-slate-200/60 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-700">🏠 AIRBNB</span>
                            <select v-model="item['Airbnb Reservado?']" @change="atualizarPlanilha(item, 'Airbnb Reservado?', item['Airbnb Reservado?'])" 
                                    class="text-xs font-bold border rounded px-2 py-0.5 outline-none cursor-pointer" 
                                    :class="getStatusColorClass(item['Airbnb Reservado?'])">
                                <option value="Sim">Sim</option>
                                <option value="Não">Não</option>
                                <option value="N/A">N/A</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold block">ENDEREÇO DO AIRBNB</label>
                                <input type="text" v-model="item['Endereço Airbnb']" @blur="atualizarPlanilha(item, 'Endereço Airbnb', item['Endereço Airbnb'])" placeholder="Endereço completo" class="w-full text-xs bg-white border border-slate-200 rounded px-2 py-1 outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <div class="flex justify-between items-center">
                                    <label class="text-[10px] text-slate-400 font-semibold block">LINK COMPROVANTE AIRBNB</label>
                                    <a v-if="item['Foto/Link Comprovante Airbnb']" :href="item['Foto/Link Comprovante Airbnb']" target="_blank" class="text-[10px] text-blue-600 underline font-medium">Abrir</a>
                                </div>
                                <input type="text" v-model="item['Foto/Link Comprovante Airbnb']" @blur="atualizarPlanilha(item, 'Foto/Link Comprovante Airbnb', item['Foto/Link Comprovante Airbnb'])" placeholder="URL da reserva" class="w-full text-xs bg-white border border-slate-200 rounded px-2 py-1 outline-none focus:border-blue-500">
                            </div>
                        </div>
                    </div>

                    <!-- Roteiro do Dia -->
                    <div class="mb-3">
                        <label class="text-[10px] font-bold text-slate-400 block mb-1 uppercase">Roteiro e Pontos de Interesse</label>
                        <textarea v-model="item['Roteiro do Dia']" @blur="atualizarPlanilha(item, 'Roteiro do Dia', item['Roteiro do Dia'])" rows="3" class="w-full text-xs border rounded-lg p-2 border-slate-200 focus:border-blue-500 outline-none resize-none bg-white"></textarea>
                    </div>
                </div>

                <!-- O que não pode perder -->
                <div class="mt-2 pt-3 border-t border-slate-200/60 bg-amber-50/70 p-3 rounded-lg">
                    <label class="text-[10px] font-bold text-amber-800 block mb-1">⭐ O QUE NÃO PODE PERDER</label>
                    <input type="text" v-model="item['O que NÃO Pode Perder (Imperdível)']" @blur="atualizarPlanilha(item, 'O que NÃO Pode Perder (Imperdível)', item['O que NÃO Pode Perder (Imperdível)'])" class="w-full text-xs bg-transparent border-b border-amber-300 focus:border-amber-500 outline-none py-1 text-amber-950 font-medium">
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        
        // Substitua pela sua URL do Web App do Apps Script
        const SCRIPT_URL = "SUA_URL_DO_WEB_APP_AQUI";

        createApp({
            setup() {
                const dias = ref([]);
                const loading = ref(false);
                const saving = ref(false);
                const filtroTipo = ref('Todos');

                const carregarDados = async () => {
                    if (SCRIPT_URL.includes("SUA_URL")) return;
                    loading.value = true;
                    try {
                        const res = await fetch(SCRIPT_URL);
                        dias.value = await res.json();
                    } catch (e) {
                        console.error("Erro ao carregar dados", e);
                    } finally {
                        loading.value = false;
                    }
                };

                const atualizarPlanilha = async (item, field, value) => {
                    if (SCRIPT_URL.includes("SUA_URL")) return;
                    saving.value = true;
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                rowIndex: item.rowIndex,
                                field: field,
                                value: value
                            })
                        });
                    } catch (e) {
                        console.error("Erro ao salvar", e);
                    } finally {
                        saving.value = false;
                    }
                };

                // Regra de Pernoite solicitada
                const getPernoiteValue = (item) => {
                    const tipo = item['Tipo de Dia'];
                    const hub = item['Cidade Hub Atual'] || '—';
                    const destino = item['Destino (Bate-volta / Mudança)'] || '—';
                    
                    if (tipo === 'Explorar Hub' || tipo === 'Bate-Volta') {
                        return hub;
                    } else if (tipo === 'Chegada' || tipo === 'Retorno' || tipo === 'Mudança de Hub') {
                        return destino !== '—' ? destino : hub;
                    }
                    return hub;
                };

                // Cores dos Cards por Tipo de Dia
                const getCardColorClass = (tipo) => {
                    switch (tipo) {
                        case 'Chegada': return 'border-purple-200 bg-purple-50/30';
                        case 'Explorar Hub': return 'border-blue-200 bg-blue-50/30';
                        case 'Bate-Volta': return 'border-emerald-200 bg-emerald-50/30';
                        case 'Mudança de Hub': return 'border-amber-200 bg-amber-50/30';
                        case 'Retorno': return 'border-pink-200 bg-pink-50/30';
                        default: return 'border-slate-200 bg-white';
                    }
                };

                // Cores dos Badges superiores
                const getBadgeColorClass = (tipo) => {
                    switch (tipo) {
                        case 'Chegada': return 'bg-purple-100 text-purple-800';
                        case 'Explorar Hub': return 'bg-blue-100 text-blue-800';
                        case 'Bate-Volta': return 'bg-emerald-100 text-emerald-800';
                        case 'Mudança de Hub': return 'bg-amber-100 text-amber-800';
                        case 'Retorno': return 'bg-pink-100 text-pink-800';
                        default: return 'bg-slate-100 text-slate-800';
                    }
                };

                // Cores dos Dropdowns de Status (Sim / Não / N/A)
                const getStatusColorClass = (status) => {
                    if (status === 'Sim') return 'bg-green-100 text-green-800 border-green-300';
                    if (status === 'Não') return 'bg-red-100 text-red-800 border-red-300';
                    return 'bg-slate-100 text-slate-600 border-slate-300'; // N/A
                };

                const diasFiltrados = computed(() => {
                    if (filtroTipo.value === 'Todos') return dias.value;
                    return dias.value.filter(d => d['Tipo de Dia'] === filtroTipo.value);
                });

                onMounted(() => {
                    carregarDados();
                });

                return { 
                    dias, loading, saving, filtroTipo, carregarDados, 
                    atualizarPlanilha, diasFiltrados, getPernoiteValue,
                    getCardColorClass, getBadgeColorClass, getStatusColorClass 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
